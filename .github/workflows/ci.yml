name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: 单元测试与 Android 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 单元测试（bridge + shared jvm）
        run: ./gradlew :bridge:test :shared:jvmTest --no-daemon

      - name: Android Debug APK 构建
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            shared/build/reports/tests/

  desktop-package:
    name: 桌面安装包构建（Windows）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 播放内核原生件（mpv/vlc/mdk）不入库，CI 产物为不含内核的安装包；
      # 带内核的发布包由本地构建后人工分发
      - name: 桌面 exe 打包
        run: ./gradlew :composeApp:packageExe --no-daemon

      - name: 上传桌面安装包
        uses: actions/upload-artifact@v4
        with:
          name: ShijieCmp-desktop-exe
          path: composeApp/build/compose/binaries/main/exe/*.exe
          retention-days: 7
